name: Update PR branches with main and merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into each open PR branch and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the latest state of origin
          git fetch origin

          # Get all open PRs targeting main
          prs=$(gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | "\(.number) \(.headRefName)"')

          if [ -z "$prs" ]; then
            echo "No open PRs targeting main found."
            exit 0
          fi

          while IFS=' ' read -r pr_number branch_name; do
            echo "──────────────────────────────────────"
            echo "Processing PR #$pr_number (branch: $branch_name)"

            # Reset to the remote PR branch (avoids -B side-effects and stale local state)
            git checkout --detach "origin/$branch_name"
            git checkout -b "pr-${pr_number}-work"

            # Skip if the branch already contains all commits from main
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "✅ PR #$pr_number: branch is already up-to-date with main, skipping merge"
            else
              # Merge main into the PR branch (no rebase)
              if git merge origin/main --no-edit -m "chore: merge main into $branch_name"; then
                git push origin "HEAD:$branch_name"
                echo "✅ PR #$pr_number: branch updated with latest main"
              else
                echo "⚠️  PR #$pr_number: merge conflict detected, skipping"
                git merge --abort
                git checkout main
                git branch -D "pr-${pr_number}-work"
                continue
              fi
            fi

            # Enable auto-merge so the PR merges once required checks pass.
            # gh pr merge --auto respects branch protection rules (required reviews,
            # status checks) and will only merge when all conditions are satisfied.
            gh pr merge "$pr_number" --merge --auto \
              && echo "✅ PR #$pr_number: auto-merge enabled" \
              || echo "⚠️  PR #$pr_number: could not enable auto-merge (may already be set or checks not configured)"

            # Clean up temporary local branch and return to main
            git checkout main
            git branch -D "pr-${pr_number}-work"
          done <<< "$prs"
